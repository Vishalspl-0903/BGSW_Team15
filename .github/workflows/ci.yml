name: Guardian CI Release Gate

on:
  push:
    branches: [ main, D, feat/** ]
  pull_request:
    branches: [ main, D ]

jobs:
  test-and-verify:
    name: Test Suite & Day 1 Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui/requirements.txt pytest

      - name: Run unit & smoke tests
        run: |
          python -m pytest -q

      - name: Execute Day 1 Release Checklist (§16 / §21)
        run: |
          python scripts/release_checklist.py

